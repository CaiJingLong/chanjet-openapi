name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Remove .npmrc auth placeholder for OIDC
        run: |
          # setup-node 写入 _authToken=${NODE_AUTH_TOKEN} 到 .npmrc，
          # 空值会导致 npm ENEEDAUTH 而非走 OIDC，必须删除
          sed -i '/_authToken/d; /always-auth/d' ~/.npmrc 2>/dev/null || true
          rm -f /home/runner/work/_temp/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build
      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test

      - name: Check formatting
        run: pnpm format:check

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm publish -r --provenance --no-git-checks
          version: pnpm changeset version
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
